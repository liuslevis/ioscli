[project]
name = "ioscli"
version = "0.1.0"
description = "Screenshot, click, and enter text in iPhone Mirroring on macOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "pyobjc-framework-applicationservices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pypinyin>=0.55.0",
]

[project.scripts]
ioscli = "ioscli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ioscli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
